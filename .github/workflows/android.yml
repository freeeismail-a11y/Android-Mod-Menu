name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Shared Library
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-So
        path: |
          app/build/intermediates/cmake/debug/obj/**/*.so
          app/build/outputs/**/*.so
          app/libs/**/*.so
          
