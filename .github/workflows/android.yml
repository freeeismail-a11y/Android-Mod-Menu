name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload SO File
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-So
        path: app/build/intermediates/cxx/Debug/*/obj/local/arm64-v8a/libMyLibName.so
        
